name: Check Wyandotte public data catalogs

on:
  workflow_dispatch:
  schedule:
    - cron: "27 15 * * 1"
  push:
    paths:
      - "src/monitor_wyandotte.py"
      - "tests/test_wyandotte_monitor.py"
      - ".github/workflows/check-wyandotte.yml"

permissions:
  contents: write

concurrency:
  group: metro-wyandotte-public-source-check
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Validate source-identification guardrails
        run: python -m unittest discover -s tests -p "test_wyandotte_monitor.py" -v
      - name: Inspect official public GIS catalog names
        run: python src/monitor_wyandotte.py
      - name: Publish monitoring report only on main
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/source_health.json
          if git diff --staged --quiet; then
            echo "Source monitor unchanged"
          else
            git commit -m "data: Wyandotte public-source check [skip ci]"
            git push
          fi
