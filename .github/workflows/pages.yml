name: Publish construction lead dashboard

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh permit data", "Check Wyandotte public data catalogs"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kc-metro-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    # A GITHUB_TOKEN data commit does not trigger a push workflow. Deploy after
    # a successful refresh via workflow_run as well as regular main-branch pushes.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out published dashboard
        uses: actions/checkout@v4
      - name: Validate static site entrypoint
        run: |
          test -f docs/index.html
          test -f docs/app.js
          test -f docs/styles.css
          test -f docs/data/permits.json
          node --check docs/app.js
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload public dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
