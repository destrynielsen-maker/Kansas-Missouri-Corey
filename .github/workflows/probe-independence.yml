name: Probe Independence Official Open Data Metadata

on:
  push:
    branches:
      - "research/independence-official-api-20261118"
    paths:
      - "tools/probe_independence.py"
      - ".github/workflows/probe-independence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install "requests>=2.32,<3"
      - name: Inspect public municipal metadata
        run: python tools/probe_independence.py
